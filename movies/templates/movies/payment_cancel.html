<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Payment Cancelled - CineShow</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body {
            font-family: 'Outfit', sans-serif;
            background-color: #0f1115;
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            text-align: center;
        }
        .container {
            background-color: #1a1c22;
            padding: 40px;
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            max-width: 500px;
            width: 90%;
        }
        .icon {
            font-size: 80px;
            color: #f59e0b;
            margin-bottom: 20px;
        }
        h1 { margin: 0 0 10px 0; font-size: 28px; }
        p { color: #9ca3af; line-height: 1.6; margin-bottom: 30px; }
        .btn {
            background-color: #f84464;
            color: white;
            text-decoration: none;
            padding: 12px 24px;
            border-radius: 8px;
            font-weight: 600;
            display: inline-block;
            transition: background 0.3s;
        }
        .btn:hover { background-color: #df2d4e; }
    </style>
</head>
<body>
    <div class="container">
        <i class="fa-solid fa-circle-exclamation icon"></i>
        <h1>Payment Cancelled</h1>
        <p>Your payment process was cancelled or failed. Your seats have not been booked.</p>
        <a href="/" class="btn"><i class="fa-solid fa-home"></i> Back to Home</a>
    </div>
</body>
</html>
